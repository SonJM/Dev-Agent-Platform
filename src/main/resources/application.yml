spring:
  application:
    name: dev-agent
  main:
    banner-mode: "off"
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true   # 화면 파일은 매번 변경 여부만 확인(바뀌지 않았으면 304) — 새 버전으로 재기동한 뒤 옛 화면이 남지 않게
  datasource:
    url: ${DB_URL:}                  # 비우면 내장 PostgreSQL(boot/EmbeddedDb) — Docker 불필요
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:                        # 로컬 단일 사용자 플랫폼: 커넥션은 폴러·워커 몇 개면 충분(기본 10 → 5)
      maximum-pool-size: 5
      minimum-idle: 1
  task:
    scheduling:
      pool:
        size: 3                    # @Scheduled 를 한 스레드가 다 돌리면 긴 작업(LLM 호출 수십 초) 동안 다른 주기 작업이 멈춘다 → 3
      thread-name-prefix: sched-

# 로컬 관리 페이지 (localhost 전용 — 외부 접속 차단)
# 접근 제어(FR-104): 상태를 바꾸는 요청(경로와 무관하게 GET·HEAD·OPTIONS 외 전부)의 Origin 이 루프백이 아니면 여기 목록과 정확히 일치해야 한다(쉼표 구분). 비우면 루프백만.
# tailscale serve 뒤에서 쓸 때 https://<MagicDNS 이름>:8443 을 넣는다. server.address 는 127.0.0.1 고정(환경변수로 바꾸지 않는다).
access:
  allowed-origins: ${ACCESS_ALLOWED_ORIGINS:}

server:
  address: 127.0.0.1
  port: ${ADMIN_PORT:8777}
  tomcat:
    threads:
      max: 16                      # 관리 페이지·대시보드(로컬 1인)용. 기본 200 은 과하다
      min-spare: 2

# 플랫폼 어댑터 선택(포트-어댑터). 값에 해당하는 구현체 빈만 뜬다 — 새 메신저/LLM 은 포트를 구현한 빈을 추가하고 여기 값만 바꾼다.
#   messenger    : MessengerPort  구현체 (none | 직접 추가한 어댑터: slack 등)
#   coding-agent : CodingAgent 구현체 (claude-cli | 추후 claude-api …) — 이슈 분석/수정/검증, 질의
platform:
  messenger: ${PLATFORM_MESSENGER:none}   # none(메신저 없이 화면만) | 추가한 MessengerPort 어댑터 이름
  coding-agent: ${PLATFORM_CODING_AGENT:claude-cli}
  # 운영 알림(M6)
  ops:
    notify-on-startup: true           # 기동 시 "나에게 보내기"로 시작 알림
    alert-cooldown-minutes: 30        # 오류 알림 최소 간격(스팸 방지)

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

# Claude Code CLI(headless) 실행 파일 — 코딩 에이전트가 쓴다 (구독 로그인, API 키 불필요)
claude:
  cli-command: ${CLAUDE_CLI_COMMAND:claude}
  # claude.exe 를 직접 실행(cmd.exe 코드페이지 우회 → 한글 인자 안전). 비면 cli-command 기준 자동 탐색.
  exe-command: ${CLAUDE_EXE_COMMAND:}        # 비우면 자동 탐색(config/ClaudeCliLocator: PATH · npm 전역 · ~/.local/bin)

# GitHub 이슈 수정 에이전트 — 라벨 이슈를 1건씩: 소스 준비 → 분석/설계(자기방 확인) → 수정(자기방 확인) → ai/ 브랜치 푸시 → 코멘트·PR.
# 사용자 확인은 자기방 메시지로만 받는다. 코딩용 Claude 는 저장소 디렉터리에서 별도 claude -p 세션.
# 사용자 정의 MCP 연동 — 관리 화면에서 등록한 서버를 Claude Code CLI 에 --mcp-config 로 붙인다(내장 서버 없음).
mcp:
  enabled: ${MCP_ENABLED:true}               # 사용자 정의 MCP 기능 전체(테이블 준비·설정 파일 생성)
  agent-enabled: ${MCP_AGENT_ENABLED:true}   # 이슈 에이전트(분석/수정) 실행에 붙일지

# GitHub 연동(이슈·PR·git 인증). 토큰은 fine-grained PAT(개인 계정의 대상 저장소만) — 서버 .env 의 GITHUB_TOKEN 에만 둔다. 비어도 기동된다(설치 점검이 알려 줌)
github:
  token: ${GITHUB_TOKEN:}
  api-url: ${GITHUB_API_URL:https://api.github.com}   # https 만 허용(시험용 localhost·127.0.0.1 http 는 허용하되 설치 점검이 경고)
  trusted-authors-only: ${GITHUB_TRUSTED_AUTHORS_ONLY:true}   # 이슈 본문·코멘트 작성자가 OWNER/MEMBER/COLLABORATOR 일 때만 처리·프롬프트 반영

issue:
  enabled: ${ISSUE_ENABLED:false}
  projects: ${ISSUE_PROJECTS:}             # 쉼표구분 "owner/repo"
  label: ${ISSUE_LABEL:ai-fix}             # 이 라벨이 붙은 열린 이슈만 자동 처리 (비우면 열린 이슈 전부 — 비권장)
  scan-interval-ms: ${ISSUE_SCAN_INTERVAL_MS:120000}      # 2분(프로젝트당 GitHub 호출 1회, 라벨 붙인 뒤 최대 2분 안에 큐 등록)
  reply-poll-interval-ms: ${ISSUE_REPLY_POLL_MS:5000}     # 자기방 답변 폴링
  work-dir: ${ISSUE_WORK_DIR:work}         # 저장소 clone 루트 (git 제외)
  # 브랜치/커밋 컨벤션: 브랜치 {유형}/{이슈번호}(예 fix/12), 모든 유형이 저장소 기본 브랜치에서 분기해 기본 브랜치로 Draft PR. 커밋 첫 줄 feat|fix|docs|...: 제목
  convention:
    prefixes: ${ISSUE_BRANCH_PREFIXES:feature,fix,refactor,doc,hotfix}
  git-user-name: ${ISSUE_GIT_USER_NAME:dev-agent}
  git-user-email: ${ISSUE_GIT_USER_EMAIL:dev-agent@example.com}
  comment-on-issue: ${ISSUE_COMMENT_ON_ISSUE:true}
  create-pr: ${ISSUE_CREATE_PR:true}
  prefetch: ${ISSUE_PREFETCH:true}
  concurrency: ${ISSUE_CONCURRENCY:2}      # 동시에 진행할 이슈 수(수정/검증이 겹치면 Maven·Claude 가 병렬로 돈다). 프리뷰 Tomcat 은 1개 공유(순서 대기)
  wait-remind-ms: ${ISSUE_WAIT_REMIND_MS:14400000}  # 확인 대기 4시간마다 자기방 리마인더(0=끔)         # 확인 대기 중 다음 이슈 선분석(세션별 git worktree 사용)
  agent:
    model: ${ISSUE_AGENT_MODEL:opus}
    effort: ${ISSUE_AGENT_EFFORT:high}
    timeout-ms: ${ISSUE_AGENT_TIMEOUT_MS:3600000}         # 분석(설계·재설계) 1회 실행 상한 60분
    max-turns: ${ISSUE_AGENT_MAX_TURNS:80}                # 분석 턴 상한
    fix-timeout-ms: ${ISSUE_AGENT_FIX_TIMEOUT_MS:14400000} # 개발(수정·재수정) 1회 실행 상한 4시간 — 큰 이슈(마이그레이션 등)용
    fix-max-turns: ${ISSUE_AGENT_FIX_MAX_TURNS:600}       # 개발 턴 상한(파일 수십 개 수정이면 수백 턴)
    idle-timeout-ms: ${ISSUE_AGENT_IDLE_TIMEOUT_MS:2700000} # 무응답 상한 45분: 도구 호출·출력이 이 시간 동안 없으면 멈춘 것으로 보고 중단(0=끔). 긴 빌드는 Bash 결과가 와야 갱신되므로 빌드 시간보다 길게
    # 상한에 걸리면 분석은 실패(FAILED), 개발은 작업트리 변경을 보존한 채 리뷰 대기로 넘겨 「피드백: 이어서 진행」으로 같은 세션을 계속할 수 있다
    # 분석 단계: 읽기 전용
    analyze-tools: ${ISSUE_AGENT_ANALYZE_TOOLS:Read,Grep,Glob,LS,Bash(git log:*),Bash(git show:*),Bash(git blame:*)}
    # 수정 단계: 파일 편집 + 지정 빌드/테스트 명령만 (Bash(<접두어>:*) 패턴). push/commit 은 봇이 수행.
    fix-tools: ${ISSUE_AGENT_FIX_TOOLS:Read,Grep,Glob,LS,Edit,Write,MultiEdit,Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(gradlew:*),Bash(./gradlew:*),Bash(gradlew.bat:*),Bash(mvn:*),Bash(./mvnw:*),Bash(npm test:*),Bash(npm run:*),Bash(npx vitest:*),Bash(npx jest:*),Bash(node --check:*)}
    test-hint: ${ISSUE_AGENT_TEST_HINT:Gradle 프로젝트는 gradlew test (또는 영향 모듈만 :module:test), Maven 은 mvn -q test, Node 는 npm test 를 실행}
    max-message-chars: ${ISSUE_AGENT_MAX_MESSAGE_CHARS:3000}  # 메신저 1건 길이 상한(초과 시 분할 전송)
  # 검증 단계: 수정 후 봇이 직접 컴파일/JS 문법 검사(node --check)를 돌리고, 독립 리뷰어 Claude 세션이 이슈·설계·diff 를 보고 PASS/FAIL.
  # FAIL 이면 실패 내역을 피드백으로 자동 재수정(max-retries 회), 그래도 FAIL 이면 실패 내역과 함께 리뷰 대기로 올린다.
  verify:
    enabled: ${ISSUE_VERIFY_ENABLED:true}
    max-retries: ${ISSUE_VERIFY_MAX_RETRIES:2}
    reviewer: ${ISSUE_VERIFY_REVIEWER:true}
    model: ${ISSUE_VERIFY_MODEL:}                       # 비우면 agent.model
    effort: ${ISSUE_VERIFY_EFFORT:medium}
    command-timeout-ms: ${ISSUE_VERIFY_COMMAND_TIMEOUT_MS:900000}
    # 프로젝트별 검사 명령 "group/repo=명령;group/repo2=명령". 비우면 pom.xml → mvn -o -q compile, gradle → gradlew compileJava, 그 외 생략.
    commands: ${ISSUE_VERIFY_COMMANDS:}
    tools: ${ISSUE_VERIFY_TOOLS:Read,Grep,Glob,LS,Bash(git diff:*),Bash(git status:*),Bash(git log:*)}
    reviewer-timeout-ms: ${ISSUE_VERIFY_REVIEWER_TIMEOUT_MS:3600000}   # 리뷰어 세션 1회 실행 상한 60분(0 이면 agent.timeout-ms)

logging:
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: logs/dev-agent.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  level:
    root: INFO
    # 기본 INFO. DEBUG 로 두면 MyBatis 가 폴링마다 SQL 과 파라미터(메시지 본문 포함)를 찍어 로그의 90% 가까이를 차지한다(11-16 실측).
    # 문제를 추적할 때만 LOG_LEVEL_APP=DEBUG 로 올린다.
    io.github.lib0823.devagent: ${LOG_LEVEL_APP:INFO}

# Claude 토큰 사용량(구독제: 비용 대신 토큰). 배터리 게이지의 5시간 창 예산 — 실제 한도에 걸리면 그 시점 사용량으로 자동 학습(bot_setting.usage_window_capacity)
usage:
  window-budget-tokens: ${USAGE_WINDOW_BUDGET:2000000}
  plan-api: ${USAGE_PLAN_API:true}            # Claude Code 가 저장한 OAuth 토큰(~/.claude/.credentials.json)으로 /usage 와 같은 구독 사용률 API 호출(5h·7d %, 리셋). 실패하면 추정치
  credentials-file: ${USAGE_CREDENTIALS_FILE:} # 비우면 ~/.claude/.credentials.json

# 질의(리서치) 워크플로우: 대시보드 "질의" 탭 / 자기방 "@AI 질문 batch: …" — 대상 프로젝트의 읽기 전용 worktree 에서 소스를 훑어 마크다운 문서로 답한다.
# 코드 수정·빌드 없음. 후속 질문은 같은 Claude 세션을 --resume. 이슈 워커와 분리된 단일 워커, 사용량 한도 중엔 대기열 보류.
research:
  enabled: ${RESEARCH_ENABLED:true}
  timeout-ms: ${RESEARCH_TIMEOUT_MS:1800000}     # 질문 1건 상한 30분
  max-turns: ${RESEARCH_MAX_TURNS:60}
  model: ${RESEARCH_MODEL:}                      # 비우면 관리 페이지 '기획' 모델(질의마다 화면에서 고를 수 있음)
  effort: ${RESEARCH_EFFORT:}
  max-result-chars: ${RESEARCH_MAX_RESULT_CHARS:60000}
  attachment-keep-days: ${RESEARCH_ATTACHMENT_KEEP_DAYS:7}   # 첨부 이미지: 스레드가 끝나고(마지막 항목 종료) 이 일수가 지나면 파일 삭제. 0 = 지우지 않음
  verify: ${RESEARCH_VERIFY:true}                 # 2차 검증 기본값: 독립 검증자(테스트 모델)가 문서를 소스와 대조 → 지적이 있으면 작성 세션이 1회 수정

# 플랫폼 관리(자기 유지보수): 상단바 렌치 버튼의 채팅 창 → 이 플랫폼의 소스 저장소에서 도는 Claude 세션(버그 확인·수정·테스트/빌드·커밋·스킬 등록).
# 푸시와 재시작은 세션이 하지 않고 창의 버튼이 한다.
maintain:
  enabled: ${MAINTAIN_ENABLED:true}
  repo-dir: ${MAINTAIN_REPO_DIR:}                # 비우면 실행 디렉터리가 소스 저장소(.git · build.gradle · src/main/java)일 때만 켜진다. 배포판은 소스를 받아 둔 경로를 지정
  model: ${MAINTAIN_MODEL:}                      # 비우면 에이전트 설정의 '개발' 모델(대화마다 창에서 고를 수 있음)
  effort: ${MAINTAIN_EFFORT:}
  timeout-ms: ${MAINTAIN_TIMEOUT_MS:7200000}     # 요청 1건 상한 2시간
  max-turns: ${MAINTAIN_MAX_TURNS:300}
  max-answer-chars: ${MAINTAIN_MAX_ANSWER_CHARS:40000}
  # 편집 + 빌드/테스트 + 로컬 커밋 + 로컬 API(curl). git push 는 여기 넣어도 구현체가 금지한다.
  tools: ${MAINTAIN_TOOLS:Read,Grep,Glob,LS,Edit,Write,MultiEdit,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git add:*),Bash(git commit:*),Bash(git restore:*),Bash(git stash:*),Bash(git branch:*),Bash(git mv:*),Bash(git rm:*),Bash(./gradlew:*),Bash(./gradlew.bat:*),Bash(gradlew:*),Bash(gradlew.bat:*),Bash(node --check:*),Bash(curl -s:*),Bash(ls:*),Bash(tail:*),Bash(head:*),Bash(grep:*),Bash(wc:*)}
